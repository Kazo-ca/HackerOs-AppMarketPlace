# Builds one catalog folder from the commit its store.json names (ADR 0188 §5 steps 3-4, §6).
# Runs code from the app's repository: call it only from a job with a read-only token and no
# secrets. Every value that comes from the PR reaches the shell through env, never through ${{ }}.
name: Build app from its commit
description: Fetches the app repository at the store.json commit and runs HackerOsPack, optionally under CodeQL.

inputs:
  folder:
    description: Name of the folder under apps/ (already checked by the catalog tool).
    required: true
  output:
    description: Directory that receives the .hackapp package.
    required: true
  codeql:
    description: "'true' to analyze the app with CodeQL (results written as SARIF, not uploaded)."
    required: false
    default: 'false'
  sarif:
    description: Directory that receives the SARIF files when codeql is 'true'.
    required: false
    default: ''

outputs:
  built:
    description: "'true' when the build produced a package."
    value: ${{ steps.build.outputs.built }}

runs:
  using: composite
  steps:
    - name: Read store.json
      id: store
      shell: bash
      env:
        FOLDER: ${{ inputs.folder }}
      run: |
        store="apps/$FOLDER/store.json"
        {
          echo "repository=$(jq -r '.repository' "$store")"
          echo "commit=$(jq -r '.commit' "$store")"
          echo "project=$(jq -r '.project // ""' "$store")"
        } >> "$GITHUB_OUTPUT"

    - name: Fetch the app at its commit
      shell: bash
      env:
        REPOSITORY: ${{ steps.store.outputs.repository }}
        COMMIT: ${{ steps.store.outputs.commit }}
      run: |
        # Step 3 of the checks: the commit must exist in the repository store.json names.
        git init --quiet "$RUNNER_TEMP/app-src"
        cd "$RUNNER_TEMP/app-src"
        if ! git fetch --quiet --depth 1 "$REPOSITORY" "$COMMIT"; then
          echo "::error::Commit $COMMIT was not found in $REPOSITORY."
          exit 1
        fi
        git checkout --quiet FETCH_HEAD
        # An app made with the hackeros-solution template (HackerOS ADR 0207) reads its HackerOS
        # version from the external/HackerOs submodule (build/Versions.props) and stops without it
        # (HOSAPP0070). Only that submodule is fetched, and only from Kazo-ca/HackerOs: the app
        # chooses the HackerOS release, not where its build code comes from.
        if [ -f .gitmodules ]; then
          name=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '$2 == "external/HackerOs" {sub(/^submodule\./, "", $1); sub(/\.path$/, "", $1); print $1; exit}')
          if [ -n "$name" ]; then
            url=$(git config -f .gitmodules --get "submodule.$name.url")
            case "$url" in
              https://github.com/Kazo-ca/HackerOs|https://github.com/Kazo-ca/HackerOs.git) ;;
              *) echo "::error file=.gitmodules::external/HackerOs must point to https://github.com/Kazo-ca/HackerOs, not $url."; exit 1 ;;
            esac
            git submodule update --init --depth 1 --quiet -- external/HackerOs
          fi
        fi

    - name: Set up .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Find the languages to analyze
      id: languages
      if: inputs.codeql == 'true'
      shell: bash
      run: |
        # The app's own code only: external/HackerOs (the submodule fetched above) is HackerOS.
        javascript=false
        if [ -n "$(find "$RUNNER_TEMP/app-src" -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.ts' \) -not -path '*/.git/*' -not -path "$RUNNER_TEMP/app-src/external/*" -print -quit)" ]; then
          javascript=true
        fi
        echo "javascript=$javascript" >> "$GITHUB_OUTPUT"

    # JavaScript/TypeScript can only be analyzed with build-mode none, which the CodeQL action runs in
    # the job's directory (this catalog), not in source-root: the app's JavaScript is analyzed here
    # with the CodeQL CLI of the runner, on the app's sources, before the C# build is traced.
    - name: Analyze the JavaScript with CodeQL
      if: inputs.codeql == 'true' && steps.languages.outputs.javascript == 'true'
      shell: bash
      env:
        SOURCE: ${{ runner.temp }}/app-src
        SARIF: ${{ inputs.sarif }}
      run: |
        codeql=$(find /opt/hostedtoolcache/CodeQL -mindepth 4 -maxdepth 4 -path '*/x64/codeql/codeql' -type f 2>/dev/null | sort -V | tail -n 1)
        if [ -z "$codeql" ]; then
          echo "::error::No CodeQL bundle on this runner: the app's JavaScript is not analyzed."
          exit 1
        fi
        config="$RUNNER_TEMP/codeql-javascript.yml"
        printf 'paths-ignore:\n  - external/**\n' > "$config"
        "$codeql" database create "$RUNNER_TEMP/codeql-javascript" --language=javascript --build-mode=none \
          --source-root "$SOURCE" --codescanning-config "$config" --overwrite
        mkdir -p "$SARIF"
        "$codeql" database analyze "$RUNNER_TEMP/codeql-javascript" \
          codeql/javascript-queries:codeql-suites/javascript-code-scanning.qls \
          --format=sarif-latest --output "$SARIF/javascript.sarif"

    - name: Start CodeQL
      if: inputs.codeql == 'true'
      uses: github/codeql-action/init@v4
      with:
        languages: csharp
        # The C# of the app is analyzed from its build, traced in the next step.
        build-mode: manual
        source-root: ${{ runner.temp }}/app-src

    - name: Build with HackerOsPack
      id: build
      shell: bash
      working-directory: ${{ runner.temp }}/app-src
      env:
        PROJECT: ${{ steps.store.outputs.project }}
        OUTPUT: ${{ inputs.output }}
      run: |
        # Release builds take the HackerOS SDK packages from NuGet (ADR 0176), at the version of the
        # external/HackerOs submodule fetched above.
        mkdir -p "$OUTPUT"
        if dotnet build ${PROJECT:+"$PROJECT"} -c Release -t:HackerOsPack -p:HackerOsPackageOutput="$OUTPUT" -nologo; then
          if [ -n "$(find "$OUTPUT" -name '*.hackapp' -print -quit)" ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::The build succeeded but produced no .hackapp package."
        fi
        echo "built=false" >> "$GITHUB_OUTPUT"

    - name: Analyze with CodeQL
      if: inputs.codeql == 'true' && steps.build.outputs.built == 'true'
      uses: github/codeql-action/analyze@v4
      with:
        upload: never
        output: ${{ inputs.sarif }}
        checkout_path: ${{ runner.temp }}/app-src
